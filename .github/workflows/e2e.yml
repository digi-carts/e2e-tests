name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag filter (e.g. @smoke, @api, @ui)"
        required: false
        default: "@smoke"
      target_url:
        description: "Override API Gateway URL"
        required: false
        default: ""
  schedule:
    # Run smoke suite every day at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches: [main]

env:
  API_GATEWAY_URL: ${{ inputs.target_url || 'https://digi-cart-api-gateway-dev-wdbieowaja-ue.a.run.app' }}
  PLATFORM_UI_URL: https://digi-cart-platform-ui-dev-wdbieowaja-ue.a.run.app
  ADMIN_UI_URL: https://digi-cart-merchant-ui-dev-wdbieowaja-ue.a.run.app
  STOREFRONT_URL: https://digi-cart-storefront-dev-wdbieowaja-ue.a.run.app/s/test-store
  HEADLESS: "true"
  BROWSER: chrome

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Warm up Cloud Run services
        run: |
          curl -sf ${{ env.API_GATEWAY_URL }}/health || true
          WARMUP_TOKEN=$(curl -sf -X POST ${{ env.API_GATEWAY_URL }}/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"${{ secrets.E2E_SUPERADMIN_EMAIL }}","password":"${{ secrets.E2E_SUPERADMIN_PASSWORD }}"}' \
            | jq -r '.accessToken // ""' 2>/dev/null || echo "")
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/catalog/products -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/platform/platform-config -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/platform/templates -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/orders -H "Authorization: Bearer $WARMUP_TOKEN" -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/store -H "Authorization: Bearer $WARMUP_TOKEN" -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/shipping/rates -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/notifications/config -H "Authorization: Bearer $WARMUP_TOKEN" -o /dev/null || true
          sleep 20

      - name: Run API tests
        run: npm run test:api
        env:
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Write API test summary
        if: always()
        run: node scripts/write-step-summary.js "API Test Results"

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/

  ui-tests:
    name: UI Tests (Selenium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Start ChromeDriver
        run: chromedriver --port=9515 &

      - name: Install dependencies
        run: npm install

      - name: Warm up Cloud Run services
        run: |
          curl -sf ${{ env.API_GATEWAY_URL }}/health || true
          curl -sfX POST ${{ env.API_GATEWAY_URL }}/api/auth/login -H 'Content-Type: application/json' -d '{"email":"x","password":"x"}' -o /dev/null || true
          curl -sf ${{ env.PLATFORM_UI_URL }} -o /dev/null || true
          curl -sf ${{ env.ADMIN_UI_URL }} -o /dev/null || true
          curl -sf ${{ env.STOREFRONT_URL }} -o /dev/null || true
          sleep 15

      - name: Run UI tests
        run: npm run test:ui
        env:
          BROWSER: chrome
          HEADLESS: "true"
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Write UI test summary
        if: always()
        run: node scripts/write-step-summary.js "UI Test Results"

      - name: Upload UI screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: reports/screenshots/

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: reports/

  smoke:
    name: Smoke Tests (API + UI)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Start ChromeDriver
        run: chromedriver --port=9515 &

      - name: Install dependencies
        run: npm install

      - name: Warm up Cloud Run services
        run: |
          curl -sf ${{ env.API_GATEWAY_URL }}/health || true
          WARMUP_TOKEN=$(curl -sf -X POST ${{ env.API_GATEWAY_URL }}/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"${{ secrets.E2E_SUPERADMIN_EMAIL }}","password":"${{ secrets.E2E_SUPERADMIN_PASSWORD }}"}' \
            | jq -r '.accessToken // ""' 2>/dev/null || echo "")
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/platform/platform-config -o /dev/null || true
          curl -sf ${{ env.API_GATEWAY_URL }}/api/v1/store -H "Authorization: Bearer $WARMUP_TOKEN" -o /dev/null || true
          curl -sf ${{ env.PLATFORM_UI_URL }} -o /dev/null || true
          curl -sf ${{ env.ADMIN_UI_URL }} -o /dev/null || true
          curl -sf ${{ env.STOREFRONT_URL }} -o /dev/null || true
          sleep 15

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Write smoke test summary
        if: always()
        run: node scripts/write-step-summary.js "Smoke Test Results"

      - name: Generate HTML report
        if: always()
        run: node scripts/generate-report.js || true

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: reports/
